<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="RamPilot">
  <!-- Vector master of the RamPilot icon (RamPilot.ico is rendered from the same geometry). -->
  <defs>
    <linearGradient id="rp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#146E8C"/>
      <stop offset="1" stop-color="#0C3C60"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#rp-bg)"/>
  <!-- memory module -->
  <rect x="38.5" y="66.5" width="179" height="87" fill="#ECF6FA"/>
  <g fill="#105470">
    <rect x="59" y="85.6" width="32.3" height="48.7"/>
    <rect x="111.8" y="85.6" width="32.3" height="48.7"/>
    <rect x="164.6" y="85.6" width="32.3" height="48.7"/>
  </g>
  <g fill="#ECF6FA">
    <rect x="46" y="153.5" width="14.9" height="20.5"/>
    <rect x="75.8" y="153.5" width="14.9" height="20.5"/>
    <rect x="105.6" y="153.5" width="14.9" height="20.5"/>
    <rect x="135.4" y="153.5" width="14.9" height="20.5"/>
    <rect x="165.2" y="153.5" width="14.9" height="20.5"/>
    <rect x="195" y="153.5" width="14.9" height="20.5"/>
  </g>
  <!-- down arrow: less resident memory -->
  <polygon points="76.8,184.3 179.2,184.3 128,230.4" fill="#78DCAA"/>
</svg>
